{% extends "base.html" %}

{% block title %}
Login | NotePilot AI
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">


        <div class="card shadow">

            <div class="card-body p-4">


                <h3 class="text-center mb-4">
                    Login
                </h3>
                        {% if message %}

                        <div class="alert alert-success">
                            {{ message }}
                        </div>

                        {% endif %}


                        {% if error %}

                        <div class="alert alert-danger">
                            {{ error }}
                        </div>

                        {% endif %}

                <form method="post" action="/auth/login">


                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                                type="email"
                                name="email"
                                class="form-control"
                                required>

                    </div>


                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                                type="password"
                                name="password"
                                class="form-control"
                                required>

                    </div>


                    <button class="btn btn-primary w-100">

                        Login

                    </button>


                </form>


                <div class="text-center mt-3">

                    Don't have account?

                    <a href="/register">
                        Register
                    </a>

                </div>


            </div>

        </div>


    </div>

</div>

{% endblock %}
