{% extends "base.html" %}


{% block title %}
Register | NotePilot AI
{% endblock %}


{% block content %}


<div class="row justify-content-center">

    <div class="col-md-6">


        <div class="card shadow">

            <div class="card-body p-4">


                <h3 class="text-center mb-4">

                    Create Account

                </h3>
            {% if message %}

            <div class="alert alert-success">
                {{ message }}
            </div>

            {% endif %}


            {% if error %}

            <div class="alert alert-danger">
                {{ error }}
            </div>

            {% endif %}

                <form method="post"
                      action="/auth/register">


                    <div class="mb-3">

                        <label>
                            Full Name
                        </label>

                        <input
                                name="full_name"
                                class="form-control"
                                required>

                    </div>


                    <div class="mb-3">

                        <label>
                            Email
                        </label>

                        <input
                                type="email"
                                name="email"
                                class="form-control"
                                required>

                    </div>


                    <div class="mb-3">

                        <label>
                            Password
                        </label>

                        <input
                                type="password"
                                name="password"
                                class="form-control"
                                required>

                    </div>

                    <button class="btn btn-success w-100">

                        Create Account

                    </button>


                    <div class="text-center mt-3">

                        Already have an account?

                        <a href="/login" class="text-decoration-none">
                            Login here
                        </a>

                    </div>


                </form>


            </div>

        </div>


    </div>

</div>


{% endblock %}
