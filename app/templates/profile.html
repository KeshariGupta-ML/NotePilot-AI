{% extends "base.html" %}


{% block title %}
Profile
{% endblock %}


{% block content %}


<div class="card shadow">

    <div class="card-body">


        <h3>
            Profile
        </h3>


        <hr>


        <p>
            <strong>Name:</strong>
            {{ user.full_name }}
        </p>


        <p>
            <strong>Email:</strong>
            {{ user.email }}
        </p>


        <p>
            <strong>Member Since:</strong>
            {{ user.created_at }}
        </p>


    </div>

</div>


{% endblock %}
